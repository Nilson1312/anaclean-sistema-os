<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <a href="index.html">
        <button>
            Index
        </button>
    </a>
   

    <!--Botões para alterar os Forms-->
    <div>
        <button id="F1">Cadastrar</button>
        <button id="F2">Atualizar</button>
        <button id="F3">Deletar</button>
        <button id="F4">Buscar</button>

    </div>


    
    <div>
        <!-- Formulário de inserção/atualização de clientes -->
        <form class="modoAdd" id="Add_api" autocomplete="off" style='display: none'>
            <h1>Formulário cliente</h1>
            <p>
                <input placeholder="Id" name="Id" class="modoAtt" type="number" style="display: none">
                <input placeholder="Nome" name="nome" type="text" >

                <input placeholder="()_____-____" id="telefoneFake" name="telefoneFake" type="text" minlength="14" maxlength="14">

                <input  type="hidden" id="telefone" name="telefone" minlength="11" maxlength="11">

                <input placeholder="Email" name="email" type="text" >
            </p>
                <input placeholder="Endereco" name="endereco" type="text" >
                <input placeholder="Numero" name="numero" type="text" >
                <input placeholder="Bairro" name="bairro" type="text" >
                <input placeholder="Cidade" name="cidade" type="text" >
            </p>
            <p>
                <input type="submit" value="Enviar">
            </p>
        </form>



    
        <!-- Formulário de exclusão de clientes -->
        <form class="modoDel" id="Del_api" autocomplete="off" style="display: none">
            <h1>Deleta Cliente</h1>
            <p>
                <input class="modoDel" placeholder="Id" type="number" name="Id">
            </p>
            <p>
                <input type="submit" value="enviar">
            </p>
        </form>
    </div>

    
    <div>
        <h1>Tela de Feedback</h1>
        <!-- Últimas ações no banco-->
        <p class="modoAdd" style="display: none;">Último cliente adicionado: <span id="clienteAdd"></span></p>
        <p class="modoAtt" style="display: none;">Último cliente atualizado: <span id="clienteAtt"></span></p>
        <p class="modoDel" style="display: none;">Último cliente deletado: <span id="clienteDel"></span></p>

        <!-- Feedback sobre imprevistos/erros -->
         <p id="retorno"></p>
         <div id ="feedbackBusca"></div>
    </div>


    <!-- Posição do banco de dados-->
    <div class="tabela_estilo">
        <h1>Registros:</h1>
        <div style="display: none" id="erroCarregar">
            <h1 >Erro ao carregar banco!</h1>
            <button>Atualizar</button>
        </div>
            <ul id="registros">
            </ul>
    </div>

    




    <!-- Carrega dados no site -->
     <script>
        async function carregarClientes() {
            try{
                const response = await fetch("http://localhost:3000/Clientes",{ method:'GET'})
                const clientes = await response.json()
                const tabela = document.getElementById("registros")
                if (clientes.length == 0){
                    const razao = "Não há dados no banco!"
                    Feedback(razao)
                    return false
                }
                
                tabela.innerHTML = ""
                clientes.forEach(cliente => {
                    const li = document.createElement("li")

                    li.textContent = `${cliente.id} - ${cliente.nome} - ${cliente.telefone} - ${cliente.email} - ${cliente.endereco} - ${cliente.numero} - ${cliente.bairro} - ${cliente.cidade} - ${cliente.criado_em}`

                    tabela.appendChild(li)        
                }
            
                )   
                } catch(error){
                    console.log(error)
                    document.getElementById('erroCarregar').style.display='block'
                }
                
        }

        /* Tenta carregar novamente apertando o botão*/
        document.getElementById('erroCarregar').addEventListener('click', () =>{
            document.getElementById('erroCarregar').style.display='none'
            carregarClientes()
        })


        /* Seleção de dados através do id*/
        const selecao = async (id) =>{  
            const dados = document.querySelectorAll('li')
            const linha = Array.from(dados).find(li =>{
                const fim = li.textContent.indexOf(" -")
                return li.textContent.substring(0,fim) ==id
            })

            if (linha != null){
                const resultado = linha.textContent
                return resultado
            } else{
                const resultado = 'Não há dados com esse id!'
                return resultado
            }
        }
     </script>



    <script>

        /* Mudando os forms conforme o botão pressionado */

        document.getElementById('F1').addEventListener('click', () =>{
            document.querySelectorAll('.modoAdd').forEach(elemento =>{
                elemento.style.display="block"
            })

            document.querySelectorAll('.modoAtt').forEach(elemento =>{
                elemento.style.display="none"

            })
            document.querySelectorAll('.modoDel').forEach(elemento =>{
                elemento.style.display="none"
            })

            const limpaAtt = document.querySelector("input.modoAtt")
            limpaAtt.value = ""
            const limpaDel = document.querySelector("input.modoDel")
            limpaDel.value = ""


            }
        )

        document.getElementById('F2').addEventListener('click', () =>{
            const elementos = document.querySelectorAll('.modoAdd')

            elementos[0].style.display = "block"
            elementos[1].style.display = "none"

            document.querySelectorAll('.modoAtt').forEach(elemento =>{
                elemento.style.display="block"
            })

            document.querySelectorAll('.modoDel').forEach(elemento =>{
                elemento.style.display="none"
            })

            const limpaDel = document.querySelector("input.modoDel")
            limpaDel.value = ""

            }
    
        )


        document.getElementById('F3').addEventListener('click', () =>{
        document.querySelectorAll('.modoAdd').forEach(elemento =>{
                elemento.style.display="none"
            })

            document.querySelectorAll('.modoAtt').forEach(elemento =>{
                elemento.style.display="none"
            })

            document.querySelectorAll('.modoDel').forEach(elemento =>{
                elemento.style.display="block"
            })
            const limpaAtt = document.querySelector("input.modoAtt")
            limpaAtt.value = ""
        }

        )

        const busca = document.getElementById("F4")
        busca.addEventListener("click", ()=>{
            if (busca.style.backgroundColor != "green"){
                busca.style.backgroundColor = "green"
            }else{
                busca.style.backgroundColor = "white"
                document.getElementById("feedbackBusca").innerHTML=""
            }
            
        })


        /* Busca valores salvos */
        function retoma() {
            if (localStorage.getItem("ClienteAdd1") != null){
                 var adicionado = localStorage.getItem("ClienteAdd1")
            } else{
                var adicionado = "Não foi possível recuperar o último cliente adicionado!"
            }

            if (localStorage.getItem("ClienteAtt1") != null){
                 var atualizado = localStorage.getItem("ClienteAtt1")
            } else{
                var atualizado = "Não foi possível recuperar o último cliente atualizado!"
            }

            if (localStorage.getItem("ClienteDel1") != null){
                 var deletado = localStorage.getItem("ClienteDel1")
            } else{
                var deletado = "Não foi possível recuperar o último cliente deletado!"
            }


            document.getElementById("clienteAdd").textContent = adicionado
            document.getElementById("clienteAtt").textContent = atualizado
            document.getElementById("clienteDel").textContent = deletado    
        }





        /* Limpando forms */
        function limpa(forms){
            const formulario = document.querySelector(forms)
            formulario.reset()

            const telefone = document.getElementById("telefone")
            telefone.value = ""
        }


        /* Seleção de Feedback e envio*/

        function Feedback(razao){
            const retorno = document.querySelector("#retorno")
            retorno.textContent = razao
        }
    </script>





    <!-- Validação de dados FrontEnd -->
    <script>
        const valida = (conjunto) => {
            /* Verifica se tem um id para atualizar*/
            if (conjunto['Id'] == ''){


                 /* Testa dados que não podem ser nulos */
                if (conjunto['nome'] == '' || ! typeof (conjunto['nome'] !== 'string')){
                    console.log(typeof conjunto['nome'])
                    console.log(conjunto['nome'])
                    const razao = "O nome não pode ser nulo!"
                    Feedback(razao)
                    return false
                }
               
                if ((conjunto['telefone'] == '' || ! typeof (conjunto['telefone'] !== 'string'))){
                    console.log(typeof conjunto['telefone'])
                    console.log(conjunto['telefone'])

                    const razao = "O número de telefone não pode estar nulo!"
                    Feedback(razao)
                    return false

                }

                if (conjunto['endereco'] == '' || ! typeof (conjunto['endereco'] !== 'string')){
                    console.log(typeof conjunto['endereco'])
                    console.log(conjunto['endereco'])
                    const razao = "O endereço não pode ser nulo!"
                    Feedback(razao)
                    return false
                } 


            } else{
                let contagem = 0
                Object.values(conjunto).forEach(valor=>{
                    if (valor == ''){
                        contagem += 1
                    }
                })
                if (contagem == 8){
                    const razao = "Nenhum dado foi adicionado para ser atualizado!"
                    Feedback(razao)
                    return false
                }

            }
            
            /* Validações de tipo */
            if (conjunto['email'] != '' && !(conjunto['email'].includes("@") && (conjunto['email'].includes(".com") || conjunto['email'].includes(".br")))){
                console.log(typeof conjunto['endereco'])
                console.log(conjunto['endereco'])
                const razao = "O e-mail não está dentro dos padrões!"
                Feedback(razao)
                return false
            }

            if (conjunto['telefone'] != '' && conjunto['telefone'].length != 11){
                console.log(conjunto[telefone])
                const razao = "Número de telefone não pode estar incompleto!"
                Feedback(razao)
                return false
            }

            return true           
        }

        const telefoneFake = document.getElementById("telefoneFake")
        const telefone = document.querySelector('#telefone')
        
        /* Impede o usuário digitar caracteres além de números no telefone*/
        telefoneFake.addEventListener("beforeinput", evento =>{
            if (evento.data && !/^\d+$/.test(evento.data)) {
                evento.preventDefault();
            }
        }
        )

        /* Formata o número para o usuário ao mesmo tempo que mantém o número original para o banco*/
        telefoneFake.addEventListener('input', () => {
            const texto = telefoneFake.value
            var numeros = texto.replace(/[()\-\s]/g, '')
            telefoneFake.value = formatarTelefone(numeros);
            telefone.value = numeros;
            })

            function formatarTelefone(value) {

                if (value.length == 0){
                    return ''
                }else if(value.length <=2){
                    return `(${value}`
                }else if(value.length <=7){
                    return `(${value.slice(0,2)})${value.slice(2)}`
                }else if(value.length <=11){
                    return `(${value.slice(0,2)})${value.slice(2,7)}-${value.slice(7)}`
                }}    
    </script>



    <!-- Extrai e envia dados do formulário -->
    <script>
        const forms_Add = document.querySelector("#Add_api")

        /* Impede que o envio seja feito ao apertar enter*/
        forms_Add.addEventListener("keydown", evento =>{
            if  (evento.key == "Enter"){
                event.preventDefault()
            }
        })

        /* Se os sistema de busca estiver ativo trará automaticamente os dados ao digitar no forms de cadastro/atualiza */
        forms_Add.addEventListener("keyup", letra =>{
        if (busca.style.backgroundColor == "green"){
            const filtro = new FormData(forms_Add)
            const dados = Object.fromEntries(filtro)
            if (dados.Id != "" || Object.values(dados).some(valor => valor.length >= 1)){
                dados.telefoneFake = ""
                fetch("http://localhost:3000/BuscaCliente",{
                    method:'POST',
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)}
                ).then(async response =>{
                    const clientes = await response.json()
                    retorno(clientes)
                    })
                }else{
                    const feedback = document.getElementById("feedbackBusca")
                    feedback.innerHTML =""

                }
        }
        })

        /* faz a construção da div que contém os dados buscados*/
        function retorno(dados){
        const lista = document.createElement("div")
        lista.style.backgroundColor = "black"
        lista.style.maxHeight = "200px"
        lista.style.overflowY = "auto"
        lista.style.overflowX = "hidden"

        dados.forEach(cliente =>{
            const linha = document.createElement("p")
            linha.style.color="green"
    
            linha.textContent = `${cliente.id} - ${cliente.nome} - ${cliente.telefone} - ${cliente.email} - ${cliente.endereco} - ${cliente.numero} - ${cliente.bairro} - ${cliente.cidade} - ${cliente.criado_em}`
            lista.append(linha)

        })
        const feedback = document.getElementById("feedbackBusca")
        feedback.innerHTML = (lista.outerHTML)
        }



        /* Ao apertar o botão ativa o script de cadastro */
        forms_Add.addEventListener("submit", evento =>{
            evento.preventDefault()
            const att = document.querySelector(".modoAtt").style.display
            const  formdata = new FormData(forms_Add)
            const forms_Add_Dados = Object.fromEntries(formdata)

            if ((att == "block") == (forms_Add_Dados.Id != '') && valida(forms_Add_Dados) == true){
                fetch('http://localhost:3000/clientes',{
                    method:'POST',
                    headers: {
                        'Content-type': 'application/json'
                    },
                    body: JSON.stringify(forms_Add_Dados)
                }).then(response => response.json()).then(async resultado => {
                    await carregarClientes()
                    const dados = await selecao(resultado.Id)

                    if (dados !="Não há dados com esse id!"){
                        if (forms_Add_Dados.Id == ''){
                            localStorage.setItem("ClienteAdd1", dados)
                            const razao = "Cliente adicionado com sucesso!"
                            rotina(razao, "#Add_api")
                        }else{
                            localStorage.setItem('ClienteAtt1',dados)
                            const razao = "Cliente atualizado com sucesso!"
                            rotina(razao, "#Add_api")


                        }    

                    }else{
                        Feedback(dados)
                    }

                }).catch(error => {console.error('Erro ao enviar')
                console.log(error)})
                
                }
        })

    </script>


    <!-- Apaga Cliente -->
    <script>
        const forms_Del = document.querySelector("#Del_api")

         /* Impede que o envio seja feito ao apertar enter*/
        forms_Del.addEventListener("keydown", evento =>{
            if  (evento.key == "Enter"){
                event.preventDefault()
            }
        
        })

        forms_Del.addEventListener("keyup", letra =>{
        if (busca.style.backgroundColor == "green"){
            const filtro = new FormData(forms_Del)
            const dados = Object.fromEntries(filtro)
            if (dados.Id != ""){
                fetch("http://localhost:3000/BuscaCliente",{
                    method:'POST',
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)}
                ).then(async response =>{
                    const clientes = await response.json()
                    retorno(clientes)
                    })
                }else{
                    const feedback = document.getElementById("feedbackBusca")
                    feedback.innerHTML =""

                }
        }
        })
        
        /* Ao apertar o botão faz com que o cliente seja deletado*/
        forms_Del.addEventListener("submit", evento=>{
            evento.preventDefault()
            const formdata = new FormData(forms_Del)
            const forms_Del_Dados = Object.fromEntries(formdata)
            
            /* Verifica e busca os dados conforme id fornecido */
            selecao(forms_Del_Dados["Id"]).then(dados =>{
                if (dados != "Não há dados com esse id!"){
                var escolha ='Dados selecionados:  ' + dados + '    excluir esses dados?'
                }else{
                    Feedback(dados)
                    return
                }
                 
            /* Ativa uma notificação para confirmar a exclusão dos dados*/
            const resposta = confirm(escolha)
            if (resposta == true){
            fetch("http://localhost:3000/Deletacliente",{
                method:'POST',
                headers:{
                    'Content-type': 'application/json'
                },
                body: JSON.stringify(forms_Del_Dados)

            }).then(response => {
                localStorage.setItem('ClienteDel1',dados)
                const razao = "Cliente deletado com sucesso!"
                rotina(razao,"#Del_api")
            }).catch(error => console.error('Erro ao enviar'))

            }
            })
                    
        })
    </script>

   

    
    <!-- Scripts carregados ao entrar no site-->
    <script>
        carregarClientes()
        retoma()
        Feedback()

        function rotina(retorno, limpeza){
            carregarClientes()
            retoma()
            Feedback(retorno)
            limpa(limpeza)
        }
    </script>
</body>
